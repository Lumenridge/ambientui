<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- %BASE_URL% is substituted by Vite from the `base` option. A bare
         "/orb-circle.svg" here is NOT rewritten, so it 404s the moment the
         site is served from a subpath — which is exactly what GitHub Pages
         does. (The previous icon pointed at /vite.svg, a file this project
         has never had.) -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%orb-circle.svg" />

    <title>ambientui — an AI layer that inherits your design system</title>
    <meta
      name="description"
      content="An AI assistant that lives above your product, composed entirely from your own design system. Built on shadcn/ui and Tailwind CSS, installed as source you own."
    />

    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="ambientui — an AI layer that inherits your design system"
    />
    <meta
      property="og:description"
      content="A design system has to become a bounded configuration space before an AI can safely build inside it. This is that argument, applied to itself."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- og:image is deliberately absent until a real 1200×630 raster exists.
         A social card pointing at a missing or SVG image renders as a broken
         preview, which is worse than the plain-text card you get with none. -->

    <!-- THEME BEFORE FIRST PAINT. The class that selects the palette is
         applied by React in an effect, which is one frame too late: the
         document would paint in the default theme and then swap, a visible
         flash on every load. This stamps the class synchronously, before
         the body exists, so the first frame is already right and React only
         ever agrees with it. It matters more after the static-HTML move,
         where the prerendered document has no stored choice baked in at all.

         It must stay in the head, stay blocking, and keep agreeing with
         THEME_STORAGE_KEY / THEME_DEFAULT in theme-provider.tsx — a gate
         check (scripts/check-theme-boot.mjs) fails if they drift. Both are wrapped
         because a browser with site data blocked throws on access. -->
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem("ambientui-theme") || "dark"
          var dark =
            t === "dark" ||
            (t === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches)
          document.documentElement.classList.add(dark ? "dark" : "light")
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
