name: Release to npm

# On every push to main, changesets either opens (or updates) a "Version
# packages" PR from the pending changesets, or, when none are pending and a
# package's version is not on npm yet, publishes it. Merging the Version PR
# is the release. NPM_TOKEN must be able to publish every package in the
# @ambient-ui scope and `ambientui`.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # the same gate that guards every commit — nothing publishes red
      - run: npm run gate
      - uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          title: Version packages
          commit: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
