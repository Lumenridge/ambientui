name: Release to npm

# PREPARED, NOT ARMED. workflow_dispatch only — the first publish is a
# deliberate act, not a side effect of a merge. It needs an NPM_TOKEN
# secret (an npm automation token for the ambientui packages) added to the
# repo before it can succeed. After the first publish: the site repo swaps
# its vendored tarballs for semver ranges, and pack.yml retires.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # the same gate that guards every commit — nothing publishes red
      - run: npm run gate
      - run: npm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
