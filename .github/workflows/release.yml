name: Release to npm

# On every merge to main, publishes each package whose version is not on
# npm yet, then tags it and creates its GitHub release. Versions are bumped
# in the PR that makes the change (`npm run version-packages`, enforced by
# the gate workflow), so merging an approved PR is the release. NPM_TOKEN
# must be able to publish every package in the @ambient-ui scope and
# `ambientui`.
on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # the same gate that guards every commit — nothing publishes red
      - run: npm run gate
      # v2 reads the published packages from changesets v3's structured
      # output, so it can push the git tags and create the GitHub releases
      - uses: changesets/action@v2
        with:
          publish-script: npm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
