name: Release to npm

# On every push to main, changesets either opens (or updates) a "Version
# packages" PR from the pending changesets, or, when none are pending and a
# package's version is not on npm yet, publishes it. Merging the Version PR
# is the release. NPM_TOKEN must be able to publish every package in the
# @ambient-ui scope and `ambientui`.
on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # the same gate that guards every commit — nothing publishes red
      - run: npm run gate
      # v2 reads the published packages from changesets v3's structured
      # output, so it can push the git tags and create the GitHub releases
      - uses: changesets/action@v2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
          pr-title: Version packages
          commit-message: Version packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
